[project]
name = "erpnext_girocode"
authors = [
    { name = "AffiKSys", email = "m.heide@affiksys.com" }
]
description = "GiroCode (EPC-QR-Code) für SEPA-Überweisungen auf Rechnungen in ERPNext/Frappe. Der Code entsteht lokal auf dem Server, ohne externe Dienste."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
